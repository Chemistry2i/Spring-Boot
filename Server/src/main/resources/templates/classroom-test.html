<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Classroom API Test</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .error { color: red; }
        .success { color: green; }
        li { margin-bottom: 8px; }
    </style>
</head>
<body>
    <h1>Classroom API Test</h1>
    <div>
        <h2>Create Classroom</h2>
        <input id="classroomName" placeholder="Classroom Name" maxlength="100">
        <button onclick="createClassroom()">Create</button>
    </div>
    <div>
        <h2>All Classrooms</h2>
        <button onclick="getAllClassrooms()">Refresh</button>
        <ul id="classroomList"></ul>
    </div>
    <div id="feedback"></div>
    <script>
        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, function(m) {
                return ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                })[m];
            });
        }

        function createClassroom() {
            const name = document.getElementById('classroomName').value.trim();
            if (!name) {
                showFeedback('Classroom name is required.', false);
                return;
            }
            fetch('/api/classrooms', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name: name})
            })
            .then(res => {
                if (!res.ok) return res.json().then(err => { throw err; });
                return res.json();
            })
            .then(data => {
                showFeedback('Created: ' + JSON.stringify(data), true);
                document.getElementById('classroomName').value = '';
                getAllClassrooms();
            })
            .catch(err => showFeedback('Error: ' + (err.message || JSON.stringify(err)), false));
        }

        function getAllClassrooms() {
            fetch('/api/classrooms')
                .then(res => res.json())
                .then(data => {
                    const list = document.getElementById('classroomList');
                    list.innerHTML = '';
                    data.forEach(c => {
                        const li = document.createElement('li');
                        li.innerHTML = `
                            <b>ID:</b> ${c.id}, <b>Name:</b> <span id="name-${c.id}">${escapeHtml(c.name)}</span>
                            <b>Schedule:</b> <span id="schedule-${c.id}">${escapeHtml(c.schedule || '')}</span>
                            <button onclick="showUpdateForm(${c.id}, '${escapeHtml(c.name)}', '${escapeHtml(c.schedule || '')}')">Edit</button>
                            <button onclick="deleteClassroom(${c.id})">Delete</button>
                        `;
                        list.appendChild(li);
                    });
                });
        }

        function showUpdateForm(id, name, schedule) {
            const li = document.getElementById(`name-${id}`).parentElement;
            li.innerHTML = `
                <b>ID:</b> ${id},
                <input id="editName-${id}" value="${name}" maxlength="100" placeholder="Classroom Name">
                <input id="editSchedule-${id}" value="${schedule}" maxlength="100" placeholder="Schedule">
                <button onclick="updateClassroom(${id})">Save</button>
                <button onclick="getAllClassrooms()">Cancel</button>
            `;
        }

        function updateClassroom(id) {
            const name = document.getElementById(`editName-${id}`).value.trim();
            const schedule = document.getElementById(`editSchedule-${id}`).value.trim();
            if (!name) {
                showFeedback('Classroom name is required.', false);
                return;
            }
            fetch('/api/classrooms/' + id, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({id: id, name: name, schedule: schedule})
            })
            .then(res => {
                if (!res.ok) return res.json().then(err => { throw err; });
                return res.json();
            })
            .then(data => {
                showFeedback('Updated: ' + JSON.stringify(data), true);
                getAllClassrooms();
            })
            .catch(err => showFeedback('Error: ' + (err.message || JSON.stringify(err)), false));
        }

        function deleteClassroom(id) {
            if (!confirm('Are you sure you want to delete this classroom?')) return;
            fetch('/api/classrooms/' + id, { method: 'DELETE' })
            .then(res => {
                if (!res.ok) throw new Error('Delete failed');
                showFeedback('Deleted classroom ' + id, true);
                getAllClassrooms();
            })
            .catch(err => showFeedback('Error deleting classroom', false));
        }

        function showFeedback(msg, success) {
            const feedback = document.getElementById('feedback');
            feedback.textContent = msg;
            feedback.className = success ? 'success' : 'error';
            setTimeout(() => { feedback.textContent = ''; }, 4000);
        }

        // Initial load
        getAllClassrooms();
    </script>
</body>
</html>
