<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration</title>
    <style>
        body { font-family: Arial, sans-serif; }
        label { display: inline-block; width: 150px; margin-bottom: 5px; }
        input, select { margin-bottom: 10px; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Student Registration Form</h1>
    <form id="studentForm" autocomplete="off">
        <h2>Personal Information</h2>
        <label>Student ID (Auto):</label>
        <input type="text" id="studentId" readonly style="background-color: #eee; pointer-events: none;"><br>
        <label>Username:</label><input type="text" id="username"><br>
        <label>Email:</label><input type="email" id="email"><br>
        <label>Password:</label><input type="password" id="password" required><br>
        <label>First Name:</label><input type="text" id="firstName" required><br>
        <label>Last Name:</label><input type="text" id="lastName" required><br>
        <label>Gender:</label>
        <select id="gender" required>
            <option value="">Select...</option>
            <option value="MALE">Male</option>
            <option value="FEMALE">Female</option>
        </select><br>
        <label>Date of Birth:</label><input type="date" id="dateOfBirth" required><br>
        <label>National ID:</label><input type="text" id="nationalId"><br>
        <label>Religion:</label><input type="text" id="religion"><br>
        <label>Disability:</label><input type="text" id="disability"><br>

        <h2>Contact Information</h2>
        <label>Contact:</label><input type="text" id="contact" placeholder="0786021431" maxlength="10" value="0786021431"><br>
        <label>Home Address:</label><input type="text" id="homeAddress"><br>
        <label>District:</label><input type="text" id="district"><br>
        <label>County:</label><input type="text" id="county"><br>
        <label>Parish:</label><input type="text" id="parish"><br>

        <h2>Parent Information</h2>
        <label>Parent Name:</label><input type="text" id="parentName"><br>
        <label>Relationship:</label>
        <select id="parentRelationship">
            <option value="">Select...</option>
            <option value="FATHER">Father</option>
            <option value="MOTHER">Mother</option>
        </select><br>
        <label>Parent Contact:</label><input type="text" id="parentContact"><br>
        <label>Parent Occupation:</label><input type="text" id="parentOccupation"><br>
        <label>Parent Address:</label><input type="text" id="parentAddress"><br>

        <h2>Academic Information</h2>
        <label>Admission Date:</label><input type="date" id="admissionDate" required><br>
        <label>Class:</label><input type="text" id="className" required><br>
        <label>Stream:</label><input type="text" id="stream"><br>
        <label>Category:</label>
        <select id="category" required>
            <option value="">Select...</option>
            <option value="DAY">Day</option>
            <option value="BOARDING">Boarding</option>
        </select><br>
        <label>Previous School:</label><input type="text" id="previousSchool"><br>
        <label>House:</label><input type="text" id="house"><br>

        <h2>Attachments</h2>
        <label>Passport Photo:</label><input type="file" id="passportPhoto"><br>
        <label>Birth Certificate:</label><input type="file" id="birthCertificate"><br>

        <button type="submit">Register Student</button>
        <div id="formMessage"></div>
    </form>

    <script>
        document.getElementById('studentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageDiv = document.getElementById('formMessage');
            messageDiv.textContent = '';
            messageDiv.className = '';

            const data = {
                username: document.getElementById('username').value || document.getElementById('email').value, // Use email if username empty
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                contact: document.getElementById('contact').value,
                gender: document.getElementById('gender').value,
                dateOfBirth: document.getElementById('dateOfBirth').value,
                nationalId: document.getElementById('nationalId').value,
                religion: document.getElementById('religion').value,
                disability: document.getElementById('disability').value,
                homeAddress: document.getElementById('homeAddress').value,
                district: document.getElementById('district').value,
                county: document.getElementById('county').value,
                parish: document.getElementById('parish').value,
                parentName: document.getElementById('parentName').value,
                parentRelationship: document.getElementById('parentRelationship').value,
                parentContact: document.getElementById('parentContact').value,
                parentOccupation: document.getElementById('parentOccupation').value,
                parentAddress: document.getElementById('parentAddress').value,
                admissionDate: document.getElementById('admissionDate').value,
                className: document.getElementById('className').value,
                stream: document.getElementById('stream').value,
                category: document.getElementById('category').value,
                previousSchool: document.getElementById('previousSchool').value,
                house: document.getElementById('house').value,
                passportPhoto: document.getElementById('passportPhoto').value,
                birthCertificate: document.getElementById('birthCertificate').value
            };

            try {
                const response = await fetch('/api/students', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (response.ok) {
                    const result = await response.json();
                    messageDiv.textContent = 'Student registered successfully!';
                    messageDiv.className = 'success';
                    document.getElementById('studentId').value = result.studentId;
                    document.getElementById('studentForm').reset();
                } else {
                    const errorText = await response.text();
                    messageDiv.textContent = 'Error: ' + errorText;
                    messageDiv.className = 'error';
                }
            } catch (error) {
                messageDiv.textContent = 'Error: ' + error.message;
                messageDiv.className = 'error';
            }
        });
    </script>
</body>
</html>
