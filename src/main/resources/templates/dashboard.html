<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en-us">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Management System - Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-header">
            <h1>School Management Dashboard</h1>
            <div class="user-info">
                <span>Welcome, <span th:text="${username}">User</span>!</span>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="logout-btn">Logout</button>
                </form>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Schools</h3>
                <div class="number" th:text="${schoolCount}">0</div>
            </div>
            <div class="stat-card">
                <h3>Total Users</h3>
                <div class="number" th:text="${userCount}">0</div>
            </div>
            <div class="stat-card">
                <h3>Your Role</h3>
                <div class="number" th:text="${userRole}">Role</div>
            </div>
        </div>

        <div class="schools-section">
            <h2>School Management</h2>
            <a href="/schools/new" class="btn btn-add">Register New School</a>

            <div th:if="${schools.empty}" class="empty-state">
                <h4>No schools registered yet</h4>
                <p>Start by registering your first school!</p>
            </div>

            <div th:each="school : ${schools}" class="school-card">
                <div class="school-info">
                    <h3 th:text="${school.name}">School Name</h3>
                    <p th:text="'Address: ' + ${school.address}">Address</p>
                    <p th:text="'Email: ' + ${school.email}">Email</p>
                    <p th:text="'Phone: ' + ${school.phone}">Phone</p>
                    <p th:if="${school.website}" th:text="'Website: ' + ${school.website}">Website</p>
                </div>
                <div class="school-actions">
                    <a th:href="@{/schools/{id}/edit(id=${school.id})}" class="btn-edit">Edit</a>
                    <a th:href="@{/schools/{id}/delete(id=${school.id})}" class="btn-delete" onclick="return confirm('Are you sure you want to delete this school?')">Delete</a>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/validation.js}"></script>
</body>
</html>
