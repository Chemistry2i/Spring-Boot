<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en-us">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${school != null} ? 'Edit School' : 'Register New School'">Register New School</title>
    <link rel="stylesheet" th:href="@{/css/school-form.css}">
</head>
<body>
    <div class="container">
        <h1>School Management System</h1>

        <div th:if="${error}" class="error-message" th:text="${error}"></div>
        <div th:if="${success}" class="success-message" th:text="${success}"></div>

        <form th:action="${school != null} ? @{/schools/{id}(id=${school.id})} : @{/schools}" method="post" id="schoolForm">
            <div class="form-group">
                <label for="name">School Name *</label>
                <input type="text" id="name" name="name" th:value="${school?.name}" required
                       placeholder="Enter the full name of the school">
            </div>

            <div class="form-group">
                <label for="address">Address *</label>
                <input type="text" id="address" name="address" th:value="${school?.address}" required
                       placeholder="Enter the complete address">
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email" th:value="${school?.email}" required
                       placeholder="school@example.com">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number *</label>
                <input type="tel" id="phone" name="phone" th:value="${school?.phone}" required
                       placeholder="+1-234-567-8900">
            </div>

            <div class="form-group">
                <label for="website">Website (Optional)</label>
                <input type="url" id="website" name="website" th:value="${school?.website}"
                       placeholder="https://www.schoolwebsite.com">
            </div>

            <div class="btn-container">
                <button type="submit" class="btn" th:text="${school != null} ? 'Update School' : 'Register School'">Register School</button>
                <a href="/dashboard" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>

    <script th:src="@{/js/validation.js}"></script>
</body>
</html>
